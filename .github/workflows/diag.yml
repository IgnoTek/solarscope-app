name: Diag
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: capture
        run: |
          set +e
          exec > ci-debug.txt 2>&1
          echo "NODE $(node -v)  NPM $(npm -v)  PWD $(pwd)"
          echo "=== npm ci ==="
          npm ci; echo "ci_exit=$?"
          echo "=== cap bin ==="
          ls -la node_modules/.bin/cap 2>&1; node_modules/.bin/cap --version 2>&1
          echo "=== root files ==="
          ls -la
          echo "=== android dir ==="
          ls -la android 2>&1 | head -40
          echo "=== www ==="
          ls -la www 2>&1
          echo "=== cat capacitor.config.ts ==="
          cat capacitor.config.ts 2>&1
          echo "=== CAP SYNC ==="
          node_modules/.bin/cap sync android; echo "sync_exit=$?"
      - name: show in log
        if: always()
        run: cat ci-debug.txt
      - name: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug
          path: ci-debug.txt
      - name: commit back
        if: always()
        run: |
          git config user.name ci-bot
          git config user.email ci@users.noreply.github.com
          git add -f ci-debug.txt
          git commit -m "ci debug output [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main || echo "push failed"
