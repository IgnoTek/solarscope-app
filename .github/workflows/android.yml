name: Build Android APK (IgnoAssist)

# Compila la app en la nube (servidores gratis de GitHub) y deja el APK listo para
# descargar en la rama "builds": https://github.com/IgnoTek/solarscope-app/raw/builds-ignoassist/dist/IgnoAssist.apk
on:
  push:
    branches: [ ignoassist ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK (firma fija, instalable)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          VC=$(( ${{ github.run_number }} + 100 ))
          VN="1.0.${{ github.run_number }}"
          echo "versionCode=$VC  versionName=$VN"
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PappVersionCode=$VC -PappVersionName=$VN 2>&1 | tee gradle-out.txt

      - name: Publicar log de Gradle si fallo (via git)
        if: failure()
        run: |
          tail -n 300 gradle-out.txt > gradle-error.txt || cp gradle-out.txt gradle-error.txt
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git add -f gradle-error.txt
          git commit -m "gradle error log [skip ci]" || echo "nada"
          git push origin HEAD:ignoassist || echo "push fallo"

      - name: Guardar el APK como artefacto (respaldo)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IgnoAssist-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Entregar el APK en la rama "builds" (via git)
        if: success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IgnoAssist.apk
          ls -la dist/IgnoAssist.apk
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan builds-ignoassist
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f dist/IgnoAssist.apk
          git commit -m "APK IgnoAssist $(date -u +%Y%m%d-%H%M%S)"
          git push -f origin builds-ignoassist
